name: Keep backend warm

on:
  schedule:
    # Every 10 minutes — reduces Hugging Face Space cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Ping HF Space health endpoint
        run: |
          curl --fail --silent --show-error --location --max-time 30 --retry 2 --retry-delay 5 \
            "https://arrifection-happiness-exchange.hf.space/api/status/"
