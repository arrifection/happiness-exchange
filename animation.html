<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happiness Exchange</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#FAF8F0;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  .logo-row {
    display:flex; align-items:center; gap:20px;
  }
  .icon-wrap {
    position:relative; width:108px; height:108px;
  }
  .liquid-canvas {
    position:absolute; top:0; left:0;
    width:108px; height:108px;
    border-radius:26px; overflow:hidden;
  }
  .face-svg {
    position:absolute; top:0; left:0;
    width:108px; height:108px; overflow:visible;
  }
  .dot-l {
    opacity:0; transform-origin:34px 34px;
    animation:dotIn 0.3s cubic-bezier(0.34,1.56,0.64,1) 1.9s forwards;
  }
  .dot-r {
    opacity:0; transform-origin:74px 34px;
    animation:dotIn 0.3s cubic-bezier(0.34,1.56,0.64,1) 2.05s forwards;
  }
  .smile {
    stroke-dasharray:100; stroke-dashoffset:100;
    animation:drawSmile 0.65s ease 2.2s forwards;
  }
  @keyframes dotIn {
    0%  { opacity:0; transform:scale(0); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes drawSmile { to { stroke-dashoffset:0; } }
  .text-wrap { display:flex; flex-direction:column; }
  .t-h {
    font-size:30px; font-weight:700; color:#7C5CBF; letter-spacing:-0.3px;
    opacity:0; transform:translateX(24px);
    animation:slideIn 0.55s cubic-bezier(0.22,1,0.36,1) 2.75s forwards;
  }
  .t-e {
    font-size:30px; font-weight:700; color:#7C5CBF; letter-spacing:-0.3px;
    opacity:0; transform:translateX(24px);
    animation:slideIn 0.55s cubic-bezier(0.22,1,0.36,1) 2.95s forwards;
  }
  @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
  .pulse {
    position:absolute; width:108px; height:108px;
    border-radius:26px; border:2px solid #FFC430;
    opacity:0; pointer-events:none;
    animation:pulseOut 0.9s ease-out 2.5s forwards;
  }
  @keyframes pulseOut {
    0%  { opacity:0.9; transform:scale(1);    }
    100%{ opacity:0;   transform:scale(1.45); }
  }
</style>
</head>
<body>
  <div class="logo-row">
    <div class="icon-wrap">
      <canvas class="liquid-canvas" id="lc" width="108" height="108"></canvas>
      <div class="pulse"></div>
      <svg class="face-svg" viewBox="0 0 108 108" fill="none">
        <circle class="dot-l" cx="34" cy="34" r="7" fill="#7C5CBF"/>
        <circle class="dot-r" cx="74" cy="34" r="7" fill="#7C5CBF"/>
        <path class="smile" d="M24 64 Q54 90 84 64"
          stroke="#7C5CBF" stroke-width="8" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="text-wrap">
      <span class="t-h">Happiness</span>
      <span class="t-e">Exchange</span>
    </div>
  </div>

<script>
(function() {
  var canvas = document.getElementById('lc');
  var ctx = canvas.getContext('2d');
  var W = 108, H = 108;
  var startTime = null;
  var duration = 1700;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  }

  function drawLiquid(progress) {
    ctx.clearRect(0, 0, W, H);
    var fillH = progress * H;
    var fillY = H - fillH;
    var waveAmp = progress < 0.95 ? 6 * Math.sin(progress * Math.PI) : 0;

    ctx.beginPath();
    ctx.moveTo(0, fillY + waveAmp * Math.sin(0));
    for (var x = 0; x <= W; x += 2) {
      var y = fillY + waveAmp * Math.sin((x / W) * Math.PI * 4 + progress * 12);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = '#FFC430';
    ctx.fill();
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;
    var raw = Math.min(elapsed / duration, 1);
    drawLiquid(easeInOutCubic(raw));
    if (raw < 1) requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
